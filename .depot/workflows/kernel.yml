# Depot CI Migration
# Source: .github/workflows/kernel.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Build kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build kernel
        run: |
          depot build --project rc3tz55hnc --token "$DEPOT_TOKEN" --build-platform linux/arm64 --platform linux/arm64 -f Dockerfile.kernel -t lnx-kernel --load .
          docker create --name lnx-kernel-extract lnx-kernel true
          docker cp lnx-kernel-extract:/build/arch/arm64/boot/Image vmlinuz
          docker rm lnx-kernel-extract
          gzip -9 vmlinuz
          ls -lh vmlinuz.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vmlinuz.gz
          path: vmlinuz.gz
