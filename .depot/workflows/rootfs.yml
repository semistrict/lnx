# Depot CI Migration
# Source: .github/workflows/rootfs.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Build rootfs
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build rootfs
        run: |
          depot build --project rc3tz55hnc --token "$DEPOT_TOKEN" --build-platform linux/arm64 --platform linux/arm64 -f Dockerfile.rootfs -t lnx-rootfs --load .
          docker create --name lnx-rootfs-extract lnx-rootfs true
          docker cp lnx-rootfs-extract:/rootfs.ext4 rootfs.ext4
          docker rm lnx-rootfs-extract
          scripts/prepare-rootfs-image.sh rootfs.ext4
      - name: Compress rootfs
        run: zstd -T0 -9 rootfs.ext4 -o rootfs.ext4.zst && ls -lh rootfs.ext4.zst
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rootfs.ext4.zst
          path: rootfs.ext4.zst
