name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l . | grep -v third_party/)" || (gofmt -l . | grep -v third_party/ && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build guest init (linux/arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o cmd/lnx/init ./cmd/init

      - name: Run tests
        run: go test -race -v ./...

  build-macos:
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build guest init (linux/arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o cmd/lnx/init ./cmd/init

      - name: Build lnx (macOS)
        run: go build -ldflags '-extldflags "-Wl,-no_warn_duplicate_libraries"' -o lnx ./cmd/lnx

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lnx-darwin-arm64
          path: lnx
