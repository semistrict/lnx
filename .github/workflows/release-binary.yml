name: Build lnx binary

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      # Set when the Developer ID secrets are configured; release binaries are
      # then notarized instead of ad-hoc signed.
      HAVE_SIGNING: ${{ secrets.MACOS_SIGN_P12 != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: third_party/gvproxy-bridge/go.mod

      - name: Install Linux musl cross compiler
        run: brew install FiloSottile/musl-cross/musl-cross

      - name: Build release binary
        run: CC_LINUX=/opt/homebrew/bin/aarch64-linux-musl-gcc cargo build --release

      - name: Build Linux helper binary
        run: |
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/opt/homebrew/bin/aarch64-linux-musl-gcc \
            CC_LINUX=/opt/homebrew/bin/aarch64-linux-musl-gcc \
            cargo build --release --target aarch64-unknown-linux-musl

      - name: Import Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Sign and notarize release binary
        if: env.HAVE_SIGNING == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: scripts/sign-notarize.sh target/release/lnx

      - name: Codesign release binary (ad-hoc fallback)
        if: env.HAVE_SIGNING != 'true'
        run: codesign --entitlements entitlements.plist --force -s - target/release/lnx

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/lnx dist/lnx
          cp target/aarch64-unknown-linux-musl/release/lnx dist/lnx-linux-aarch64
          tar -C dist -czf lnx-macos-arm64.tar.gz lnx lnx-linux-aarch64
          shasum -a 256 lnx-macos-arm64.tar.gz > lnx-macos-arm64.tar.gz.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: lnx-macos-arm64
          path: |
            lnx-macos-arm64.tar.gz
            lnx-macos-arm64.tar.gz.sha256

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "lnx $tag" --generate-notes
          gh release upload "$tag" --clobber \
            lnx-macos-arm64.tar.gz lnx-macos-arm64.tar.gz.sha256

      - name: Update Homebrew formula
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          sha="$(cut -d' ' -f1 lnx-macos-arm64.tar.gz.sha256)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          sed -i '' -e "s|^  version \".*\"|  version \"${version}\"|" \
                    -e "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" Formula/lnx.rb
          if git diff --quiet Formula/lnx.rb; then
            echo "formula already current"; exit 0
          fi
          git add Formula/lnx.rb
          git commit -m "Point Homebrew formula at ${tag}"
          git push origin main
          ruby -c Formula/lnx.rb
