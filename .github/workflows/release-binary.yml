name: Build lnx binary

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every push and pull request: an ad-hoc signed build, kept as a workflow
  # artifact. Releases come only from the release job below.
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: third_party/gvproxy-bridge/go.mod

      - name: Install Linux musl cross compiler
        run: brew install FiloSottile/musl-cross/musl-cross

      - name: Build release binary
        run: |
          CC_LINUX=/opt/homebrew/bin/aarch64-linux-musl-gcc cargo build --release
          scripts/prepare-nested-helpers.sh release
          codesign --entitlements entitlements.plist --force -s - target/release/lnx

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/lnx dist/lnx
          cp target/aarch64-unknown-linux-musl/release/lnx dist/lnx-linux-aarch64
          tar -C dist -czf lnx-macos-arm64.tar.gz lnx lnx-linux-aarch64
          shasum -a 256 lnx-macos-arm64.tar.gz > lnx-macos-arm64.tar.gz.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: lnx-macos-arm64
          path: |
            lnx-macos-arm64.tar.gz
            lnx-macos-arm64.tar.gz.sha256

  # A version tag: sign with Developer ID, notarize, attest, publish, and
  # point the Homebrew formula at the release. See docs/release-automation.md.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the version tag at current main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version." >&2
            exit 1
          }
          git fetch --no-tags origin main
          if [[ "$(git rev-parse "${GITHUB_SHA}^{commit}")" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "Release tags must point at the current main commit." >&2
            exit 1
          fi

      - name: Check release credentials
        id: credentials
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          missing=()
          [[ -z "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" ]] && missing+=(DEVELOPER_ID_CERTIFICATE_P12_BASE64)
          [[ -z "$DEVELOPER_ID_CERTIFICATE_PASSWORD" ]] && missing+=(DEVELOPER_ID_CERTIFICATE_PASSWORD)
          [[ -z "$NOTARY_API_KEY_P8_BASE64" ]] && missing+=(NOTARY_API_KEY_P8_BASE64)
          [[ -z "$NOTARY_API_KEY_ID" ]] && missing+=(NOTARY_API_KEY_ID)
          [[ -z "$NOTARY_API_ISSUER_ID" ]] && missing+=(NOTARY_API_ISSUER_ID)

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release publishing is disabled because required release credentials are not configured."
            printf 'Missing: %s\n' "${missing[*]}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.credentials.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Set up Go
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: third_party/gvproxy-bridge/go.mod

      - name: Install Linux musl cross compiler
        if: steps.credentials.outputs.configured == 'true'
        run: brew install FiloSottile/musl-cross/musl-cross

      - name: Import release credentials
        if: steps.credentials.outputs.configured == 'true'
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/lnx-release.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 2700 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          xcrun notarytool store-credentials lnx-notary \
            --key "$api_key_path" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" \
            --keychain "$keychain_path"

          {
            echo "LNX_RELEASE_KEYCHAIN=$keychain_path"
            echo "LNX_NOTARY_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Build signed and notarized release
        if: steps.credentials.outputs.configured == 'true'
        run: scripts/build-distribution.sh

      - name: Verify exact packaged artifact
        if: steps.credentials.outputs.configured == 'true'
        run: |
          verification_directory=$(mktemp -d "$RUNNER_TEMP/lnx-release-verification.XXXXXX")
          tar -C "$verification_directory" -xzf dist/lnx-macos-arm64.tar.gz
          binary="$verification_directory/lnx"
          test "$(lipo -archs "$binary")" = arm64
          codesign --verify --strict --verbose=4 "$binary"
          codesign --display --entitlements - "$binary" | grep -q com.apple.security.hypervisor
          spctl --assess --type install --verbose=4 "$binary"
          (cd dist && shasum -a 256 -c lnx-macos-arm64.tar.gz.sha256)

      - name: Attest release provenance
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lnx-macos-arm64.tar.gz

      - name: Publish GitHub release
        if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/lnx-macos-arm64.tar.gz \
            dist/lnx-macos-arm64.tar.gz.sha256 \
            --verify-tag \
            --latest \
            --title "lnx $GITHUB_REF_NAME" \
            --generate-notes

      - name: Update Homebrew formula
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha="$(cut -d' ' -f1 dist/lnx-macos-arm64.tar.gz.sha256)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          sed -i '' -e "s|^  version \".*\"|  version \"${version}\"|" \
                    -e "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" Formula/lnx.rb
          ruby -c Formula/lnx.rb
          if git diff --quiet Formula/lnx.rb; then
            echo "formula already current"; exit 0
          fi
          git add Formula/lnx.rb
          git commit -m "Point Homebrew formula at ${GITHUB_REF_NAME}"
          git push origin main

      - name: Remove release keychain
        if: always() && steps.credentials.outputs.configured == 'true'
        run: |
          if [[ -n "${LNX_RELEASE_KEYCHAIN:-}" && -e "$LNX_RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$LNX_RELEASE_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
