name: Build rootfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs
        run: |
          docker buildx build --platform linux/arm64 -f Dockerfile.rootfs -t lnx-rootfs --load .
          docker create --name lnx-rootfs-extract lnx-rootfs true
          docker cp lnx-rootfs-extract:/rootfs.ext4 rootfs.ext4
          docker rm lnx-rootfs-extract
          ls -lh rootfs.ext4

      - name: Compress rootfs
        run: zstd -T0 -9 rootfs.ext4 -o rootfs.ext4.zst && ls -lh rootfs.ext4.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rootfs.ext4.zst
          path: rootfs.ext4.zst
