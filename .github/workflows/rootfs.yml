name: Build rootfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Build rootfs
        run: |
          depot build --project rc3tz55hnc --platform linux/arm64 \
            -f Dockerfile.rootfs --output type=local,dest=out .
          mv out/rootfs.ext4 rootfs.ext4
          scripts/prepare-rootfs-image.sh rootfs.ext4

      - name: Compress rootfs
        run: zstd -T0 -9 rootfs.ext4 -o rootfs.ext4.zst && ls -lh rootfs.ext4.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rootfs.ext4.zst
          path: rootfs.ext4.zst
