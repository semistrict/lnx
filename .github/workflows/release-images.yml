name: Release VM images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. v0.1.0)"
        required: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel
        run: |
          docker buildx build --platform linux/arm64 -f Dockerfile.kernel -t lnx-kernel --load .
          docker create --name lnx-kernel-extract lnx-kernel true
          docker cp lnx-kernel-extract:/build/arch/arm64/boot/Image vmlinuz
          docker rm lnx-kernel-extract
          gzip -9 vmlinuz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vmlinuz.gz
          path: vmlinuz.gz

  rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs
        run: |
          docker buildx build --platform linux/arm64 -f Dockerfile.rootfs -t lnx-rootfs --load .
          docker create --name lnx-rootfs-extract lnx-rootfs true
          docker cp lnx-rootfs-extract:/rootfs.ext4 rootfs.ext4
          docker rm lnx-rootfs-extract

      - name: Compress rootfs
        run: zstd -T0 -9 rootfs.ext4 -o rootfs.ext4.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rootfs.ext4.zst
          path: rootfs.ext4.zst

  release:
    needs: [kernel, rootfs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download kernel
        uses: actions/download-artifact@v7
        with:
          name: vmlinuz.gz

      - name: Download rootfs
        uses: actions/download-artifact@v7
        with:
          name: rootfs.ext4.zst

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: images-${{ inputs.version }}
          name: "VM images ${{ inputs.version }}"
          body: |
            Pre-built kernel and rootfs images for lnx.

            - `vmlinuz.gz` — Linux kernel (arm64, gzip compressed)
            - `rootfs.ext4.zst` — Ubuntu rootfs (zstd compressed)

            Install with: `lnx init`
          files: |
            vmlinuz.gz
            rootfs.ext4.zst
