name: Release VM images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. v0.1.0)"
        required: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Build kernel
        run: |
          depot build --project rc3tz55hnc --platform linux/arm64 \
            -f Dockerfile.kernel --output type=local,dest=out .
          gzip -9 -c out/vmlinuz > vmlinuz.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vmlinuz.gz
          path: vmlinuz.gz

  rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Build rootfs
        run: |
          depot build --project rc3tz55hnc --platform linux/arm64 \
            -f Dockerfile.rootfs --output type=local,dest=out .
          mv out/rootfs.ext4 rootfs.ext4
          scripts/prepare-rootfs-image.sh rootfs.ext4

      - name: Compress rootfs
        run: zstd -T0 -3 rootfs.ext4 -o rootfs.ext4.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rootfs.ext4.zst
          path: rootfs.ext4.zst

  linux-helpers:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Linux musl cross compiler
        run: brew install FiloSottile/musl-cross/musl-cross

      - name: Build Linux helper binary
        run: |
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/opt/homebrew/bin/aarch64-linux-musl-gcc \
            CC_LINUX=/opt/homebrew/bin/aarch64-linux-musl-gcc \
            depot cargo build --release --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/lnx lnx-linux-aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-helpers
          path: |
            lnx-linux-aarch64

  release:
    needs: [kernel, rootfs, linux-helpers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download kernel
        uses: actions/download-artifact@v7
        with:
          name: vmlinuz.gz

      - name: Download rootfs
        uses: actions/download-artifact@v7
        with:
          name: rootfs.ext4.zst

      - name: Download Linux helpers
        uses: actions/download-artifact@v7
        with:
          name: linux-helpers

      - name: Gate release assets
        run: |
          set -euo pipefail
          gzip -t vmlinuz.gz
          zstd -t rootfs.ext4.zst
          chmod +x lnx-linux-aarch64
          test -x lnx-linux-aarch64
          zstd -d --force --sparse -o rootfs.ext4 rootfs.ext4.zst
          debugfs -R 'stat /sbin/init' rootfs.ext4
          debugfs -R 'stat /usr/lib/systemd/systemd' rootfs.ext4
          debugfs -R 'stat /usr/local/bin/node' rootfs.ext4
          debugfs -R 'stat /usr/local/bin/pnpm' rootfs.ext4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: images-${{ inputs.version }}
          name: "VM images ${{ inputs.version }}"
          body: |
            Pre-built kernel and rootfs images for lnx.

            - `vmlinuz.gz` — Linux kernel (arm64, gzip compressed)
            - `rootfs.ext4.zst` — Ubuntu rootfs with node/npm/pnpm baked in (64G sparse ext4, 16K block size, zstd compressed)
            - `lnx-linux-aarch64` — Linux helper used by nested deterministic runs on macOS

            Place the decompressed images at `~/.lnx/vmlinuz` and
            `~/.lnx/images/default/rootfs.ext4`.
          files: |
            vmlinuz.gz
            rootfs.ext4.zst
            lnx-linux-aarch64
