name: Test lnx

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Depot-managed macOS runner (M4, macOS 26): GitHub-hosted macOS runners
    # do not support Apple nested virtualization, so lnx tests cannot boot
    # VMs there. Depot CI (.depot/workflows) is Linux-only, so the test
    # workflow stays on GitHub Actions with a Depot runner label.
    runs-on: depot-macos-26
    timeout-minutes: 180
    env:
      CC_LINUX: /opt/homebrew/bin/aarch64-linux-musl-gcc
      LNX_RUN_BROWSER_TEST: "1"
      LNX_RUN_PRIVILEGED_INGRESS_TEST: "1"
    steps:
      - uses: actions/checkout@v6

      # The runner context is not available in job-level env.
      - name: Set LNX_BASE
        run: echo "LNX_BASE=$RUNNER_TEMP/lnx-state" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: third_party/gvproxy-bridge/go.mod

      - name: Install host dependencies
        run: |
          brew install FiloSottile/musl-cross/musl-cross
          brew install e2fsprogs zstd podman llvm

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust tests
        run: bun run test

      - name: Full system tests
        run: bun run test:full
