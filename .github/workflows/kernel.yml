name: Build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel
        run: |
          docker buildx build --platform linux/arm64 -f Dockerfile.kernel -t lnx-kernel --load .
          docker create --name lnx-kernel-extract lnx-kernel true
          docker cp lnx-kernel-extract:/build/arch/arm64/boot/Image kernel.Image
          docker rm lnx-kernel-extract
          ls -lh kernel.Image

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel.Image
          path: kernel.Image
