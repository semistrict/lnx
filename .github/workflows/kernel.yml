name: Build kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Build kernel
        run: |
          depot build --project rc3tz55hnc --platform linux/arm64 \
            -f Dockerfile.kernel --output type=local,dest=out .
          gzip -9 -c out/vmlinuz > vmlinuz.gz
          ls -lh vmlinuz.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vmlinuz.gz
          path: vmlinuz.gz
