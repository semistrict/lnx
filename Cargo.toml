[package]
name = "lnx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace]
members = [
    ".",
    "guest-agent",
    "lnx-protocol",
]

[[bin]]
name = "lnx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
libc = "0.2"
libkrun = { package = "libkrun", path = "third_party/libkrun/src/libkrun", features = ["blk", "net"] }
lnx-protocol = { path = "lnx-protocol" }
postcard = { version = "1.1", features = ["alloc"] }
rustls = "0.23"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
