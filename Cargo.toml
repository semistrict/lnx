[package]
name = "lnx"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"

[workspace]
members = [
    ".",
    "guest-agent",
    "lnx-protocol",
]

[features]
default = []
server-ui = []

[[bin]]
name = "lnx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
futures-util = "0.3"
libc = "0.2"
libkrun = { package = "libkrun", path = "third_party/libkrun/src/libkrun", features = ["blk", "net", "vhost-user", "disable-c-api"] }
lnx-protocol = { path = "lnx-protocol" }
postcard = { version = "1.1", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
