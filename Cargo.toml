[package]
name = "lnx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "lnx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
libc = "0.2"
libkrun = { package = "libkrun", git = "https://github.com/semistrict/libkrun", rev = "b8a61e4", features = ["blk", "net"] }
time = { version = "0.3", features = ["formatting", "macros"] }
