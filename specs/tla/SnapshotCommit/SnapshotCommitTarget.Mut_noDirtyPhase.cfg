\* EXPECT: violation NoSilentAckLoss
\* Mutation check: S3 is necessary: without the dirty phase a crash after an acknowledged write is auto-recovered from latest and the write is gone.
CONSTANTS
    MaxRuns = 3
    MaxFaults = 2
    AllowPowerLoss = TRUE
    Mutation = "noDirtyPhase"
SPECIFICATION Spec
INVARIANT NoSilentAckLoss
