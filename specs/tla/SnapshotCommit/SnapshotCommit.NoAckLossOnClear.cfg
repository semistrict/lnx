\* EXPECT: violation NoAckLossOnClear
\* kill -9 of a restored run after the guest flushed (acknowledged) a write: the instance refuses to start and its only remedy (snapshots clear) deletes .restore-work, the only copy of that write. No power loss needed.
CONSTANTS
    MaxRuns = 2
    MaxFaults = 1
    SnapshotSync = TRUE
    AllowPowerLoss = FALSE
SPECIFICATION Spec
INVARIANT NoAckLossOnClear
