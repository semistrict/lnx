\* EXPECT: violation NoSilentAckLoss
\* Mutation check: S8 committing the snapshot-exit generation must keep the phase: resetting a dirty run to running makes a later crash look idle, and writes acknowledged after the snapshot-exit are dropped.
CONSTANTS
    MaxRuns = 3
    MaxFaults = 2
    AllowPowerLoss = TRUE
    Mutation = "advanceClears"
SPECIFICATION Spec
INVARIANT NoSilentAckLoss
