\* EXPECT: violation LatestAlwaysValid
\* Mutation check: S6 must follow S5: collecting "unreferenced" generations before the commit deletes the generation the commit is about to reference.
CONSTANTS
    MaxRuns = 3
    MaxFaults = 2
    AllowPowerLoss = TRUE
    Mutation = "gcBeforeCommit"
SPECIFICATION Spec
INVARIANT LatestAlwaysValid
