\* EXPECT: violation NoClearOfGoodLatest
\* kill -9 after latest was published but before .restore-work.active is removed: recovery refuses, and snapshots clear deletes the good latest and cold-boots a canonical rootfs without the acknowledged writes. No power loss needed.
CONSTANTS
    MaxRuns = 2
    MaxFaults = 1
    SnapshotSync = TRUE
    AllowPowerLoss = FALSE
SPECIFICATION Spec
INVARIANT NoClearOfGoodLatest
